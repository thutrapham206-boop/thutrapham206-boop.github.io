<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bàn Hương Quỳnh — Portfolio</title>
    <style>
        /* === CƠ BẢN === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        :root {
            --chinh: #b76e79;
            --nhac: #d4a5a5;
            --nen: #fdf7f8;
            --nhat: #ffffff;
            --toi: #4a3f42;
            --xam: #887a7d;
            --nau: #f3e6e8;
        }

        body {
            background-color: var(--nen);
            color: var(--toi);
            line-height: 1.8;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* === THANH ĐIỀU HƯỚNG === */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(183,110,121,0.08);
            z-index: 999;
            padding: 1rem 5%;
        }

        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--chinh);
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 1.8rem;
            list-style: none;
        }

        .nav-links a {
            font-weight: 500;
            color: var(--xam);
            position: relative;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--chinh);
            transition: width 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--chinh);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .menu-btn {
            display: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--chinh);
        }

        /* === PHẦN CHUNG === */
        section {
            max-width: 1100px;
            margin: 0 auto;
            padding: 7rem 5% 4rem;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 1.9rem;
            color: var(--chinh);
            margin-bottom: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        h2::before {
            content: '🎵';
            font-size: 1.5rem;
        }

        h3 {
            font-size: 1.25rem;
            color: var(--toi);
            margin: 1.8rem 0 0.8rem;
        }

        h4 {
            font-size: 1.05rem;
            margin-top: 1.5rem;
            margin-bottom: 0.6rem;
            color: var(--toi);
        }

        p {
            margin-bottom: 1rem;
            text-align: justify;
        }

        ul, ol {
            padding-left: 1.5rem;
            margin-bottom: 1.2rem;
        }

        li {
            margin-bottom: 0.5rem;
        }

        em {
            color: var(--chinh);
            font-style: normal;
            font-weight: 500;
        }

        strong {
            color: var(--toi);
            font-weight: 600;
        }

        a.link {
            color: var(--chinh);
            border-bottom: 1px dashed var(--nhac);
            transition: all 0.2s;
        }

        a.link:hover {
            border-bottom-color: var(--chinh);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.2rem 0;
            background: var(--nhat);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        th, td {
            padding: 0.9rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--nau);
            font-size: 0.95rem;
        }

        th {
            background: var(--nau);
            color: var(--chinh);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #fff9fa;
        }

        /* === TRANG CHỦ / GIỚI THIỆU === */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 4rem;
        }

        .hero-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 4rem;
            align-items: center;
        }

        .avatar-wrapper {
            position: relative;
        }

        .avatar {
            width: 280px;
            height: 340px;
            border-radius: 20px;
            object-fit: cover;
            background: var(--nau);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--chinh);
            font-size: 1rem;
            text-align: center;
            padding: 1rem;
        }

        .avatar-note {
            position: absolute;
            bottom: -10px;
            right: 10px;
            background: var(--nhat);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--chinh);
            box-shadow: 0 2px 8px rgba(183,110,121,0.12);
        }

        .hero-text h1 {
            font-size: 2.4rem;
            line-height: 1.3;
            margin-bottom: 0.5rem;
        }

        .hero-text h1 span {
            color: var(--chinh);
        }

        .hero-text .tagline {
            font-size: 1.1rem;
            color: var(--xam);
            margin-bottom: 1.5rem;
        }

        .hero-quote {
            font-style: italic;
            color: var(--chinh);
            padding-left: 1rem;
            border-left: 3px solid var(--nhac);
            margin-bottom: 2rem;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.8rem 1.8rem;
            border-radius: 30px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--chinh);
            color: white;
        }

        .btn-primary:hover {
            background: #a55d68;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(183,110,121,0.25);
        }

        .btn-outline {
            border: 2px solid var(--chinh);
            color: var(--chinh);
            background: transparent;
        }

        .btn-outline:hover {
            background: var(--chinh);
            color: white;
            transform: translateY(-2px);
        }

        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .info-card {
            background: var(--nhat);
            padding: 1.2rem;
            border-radius: 14px;
            border-left: 3px solid var(--chinh);
            box-shadow: 0 3px 10px rgba(0,0,0,0.02);
        }

        .info-card h4 {
            font-size: 0.9rem;
            color: var(--xam);
            margin-bottom: 0.3rem;
            margin-top: 0;
        }

        .info-card p {
            font-size: 1rem;
            color: var(--toi);
            margin: 0;
            font-weight: 500;
            text-align: left;
        }

        /* === KỸ NĂNG === */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .skill-card {
            background: var(--nhat);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.03);
            transition: transform 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-5px);
        }

        .skill-icon {
            font-size: 2rem;
            margin-bottom: 0.8rem;
        }

        .skill-card h3 {
            margin: 0 0 0.6rem;
            font-size: 1.1rem;
        }

        .skill-card p {
            font-size: 0.95rem;
            color: var(--xam);
            margin: 0;
            text-align: left;
        }

        /* === DANH SÁCH BÀI TẬP === */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background: var(--nhat);
            border-radius: 16px;
            padding: 1.8rem;
            box-shadow: 0 3px 12px rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .project-card:hover {
            transform: translateY(-6px);
            border-color: var(--nhac);
            box-shadow: 0 8px 25px rgba(183,110,121,0.1);
        }

        .project-number {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--nau);
            line-height: 1;
            margin-bottom: 0.8rem;
        }

        .project-card h3 {
            margin: 0 0 0.6rem;
            color: var(--chinh);
            font-size: 1.1rem;
        }

        .project-card p {
            color: var(--xam);
            font-size: 0.95rem;
            margin: 0;
            text-align: left;
        }

        /* === NỘI DUNG BÀI TẬP CHI TIẾT === */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--chinh);
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 1.5rem;
            transition: transform 0.2s ease;
        }

        .back-btn:hover {
            transform: translateX(-4px);
        }

        .exercise-content {
            background: var(--nhat);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .exercise-content h3 {
            color: var(--chinh);
            margin-top: 2rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--nau);
        }

        .exercise-content h3:first-of-type {
            margin-top: 0;
        }

        .highlight-box {
            background: linear-gradient(135deg, #fdf0f2 0%, #f9e9eb 100%);
            border-left: 4px solid var(--chinh);
            padding: 1.3rem;
            border-radius: 0 12px 12px 0;
            margin: 1.2rem 0;
        }

        .highlight-box h4 {
            margin-top: 0;
            color: var(--chinh);
        }

        .placeholder-box {
            background: var(--nen);
            border: 2px dashed var(--nhac);
            border-radius: 10px;
            padding: 2.5rem;
            text-align: center;
            color: var(--xam);
            margin: 1rem 0;
        }

        /* === TỔNG KẾT === */
        .timeline {
            position: relative;
            padding-left: 2rem;
            margin: 2rem 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, var(--chinh), var(--nhac));
            border-radius: 3px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2rem;
        }

        .timeline-dot {
            position: absolute;
            left: -2.45rem;
            top: 0.2rem;
            width: 14px;
            height: 14px;
            background: var(--chinh);
            border-radius: 50%;
            border: 3px solid var(--nen);
        }

        .timeline-item h3 {
            margin-top: 0;
            color: var(--chinh);
        }

        .conclusion-quote {
            background: linear-gradient(135deg, var(--chinh) 0%, #c4858f 100%);
            color: white;
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            margin-top: 3rem;
        }

        .conclusion-quote p {
            font-size: 1.1rem;
            font-style: italic;
            opacity: 0.95;
            text-align: center;
            margin: 0;
        }

        /* === CHÂN TRANG === */
        footer {
            text-align: center;
            padding: 3rem 2rem 2rem;
            color: var(--xam);
            font-size: 0.9rem;
            border-top: 1px solid var(--nau);
            margin-top: 4rem;
        }

        footer p {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        /* === TRẢI NGHIỆM DI ĐỘNG === */
        @media (max-width: 868px) {
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: var(--nhat);
                flex-direction: column;
                padding: 1.2rem 5%;
                gap: 1rem;
                display: none;
                box-shadow: 0 10px 15px rgba(0,0,0,0.05);
            }

            .nav-links.active {
                display: flex;
            }

            .menu-btn {
                display: block;
            }

            .hero-container {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 2rem;
            }

            .avatar-wrapper {
                display: flex;
                justify-content: center;
            }

            .hero-text h1 {
                font-size: 1.9rem;
            }

            .hero-buttons {
                justify-content: center;
            }

            .exercise-content {
